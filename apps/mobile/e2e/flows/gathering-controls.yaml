# The host's two controls: a connections-only gathering with two spots.
# A stranger's tap on the host's tag shows the card and no gathering, and
# the gathering is nowhere in their the tee sheet; one connection takes the
# last spot, and the next finds it full.
appId: ${APP_ID}
name: A connections-only round with two spots is hidden from a stranger and full after one connection joins
---
- runFlow: steps/open-signed-out.yaml

# --- Cora creates it and points her tag at it --------------------------------
- runFlow:
    file: steps/sign-in.yaml
    env:
      EMAIL: ${GC_HOST_EMAIL}
      THEN: New round
- tapOn: New round
- extendedWaitUntil:
    visible: Create a round
    timeout: 15000
# The input, not its label: both carry the name.
- tapOn:
    text: Title
    below: Title
- inputText: ${GC_TITLE}
# Golf With Me: every round has a course.
- tapOn:
    text: Course
    below: Course
- inputText: Riverside Muni
# Return closes the keyboard, which covers the fields below.
- pressKey: Enter
- tapOn: 'My connections\..*'
- scrollUntilVisible:
    element: 'Spots'
    direction: DOWN
# The input, not its label: both carry the name.
- tapOn:
    text: 'Spots.*'
    below: 'Spots'
# Golf With Me: Spots starts at 4 (a foursome); clear it first.
- eraseText: 4
- inputText: '2'
- pressKey: Enter
- scrollUntilVisible:
    element: Create round
    direction: DOWN
- tapOn: Create round
- extendedWaitUntil:
    visible: 1 of 2 playing · Connections only
    timeout: 15000
- tapOn: Point my tags at this round
- extendedWaitUntil:
    visible: Point my tags back to my profile
    timeout: 15000
- tapOn: Back
- runFlow: steps/sign-out.yaml

# --- Sid, a stranger: the tag shows Cora's card, and the tee sheet has nothing ----
- runFlow:
    file: steps/sign-in.yaml
    env:
      EMAIL: ${GC_STRANGER_EMAIL}
      THEN: New round
- runFlow:
    file: steps/open-link.yaml
    env:
      LINK: ${OPEN_URL}/--/t/${GC_HOST_UID}
- extendedWaitUntil:
    visible: Connect
    timeout: 15000
- assertVisible: ${GC_HOST_NAME}
- assertNotVisible: '.*${GC_TITLE}.*'
- assertNotVisible: Join this round
- tapOn: Close
- runFlow:
    file: steps/not-in-feed.yaml
    env:
      TITLE: ${GC_TITLE}
- runFlow: steps/sign-out.yaml

# --- Finn, a connection, finds it in the tee sheet and takes the last spot -------
- runFlow:
    file: steps/sign-in.yaml
    env:
      EMAIL: ${GC_FRIEND_EMAIL}
      THEN: New round
- runFlow:
    file: steps/reveal-in-feed.yaml
    env:
      TITLE: ${GC_TITLE}
- assertVisible: '${GC_TITLE}, .*, 1 of 2 playing · Connections only, With ${GC_HOST_NAME}'
- tapOn: '${GC_TITLE}, .*'
- tapOn: Join
- extendedWaitUntil:
    visible: 2 of 2 playing · Connections only
    timeout: 15000
- assertVisible: Leave round
- tapOn: Back
- runFlow: steps/sign-out.yaml

# --- Fay, another connection, taps the tag: the gathering, and Full ---------
- runFlow:
    file: steps/sign-in.yaml
    env:
      EMAIL: ${GC_LATE_EMAIL}
      THEN: New round
- runFlow:
    file: steps/open-link.yaml
    env:
      LINK: ${OPEN_URL}/--/t/${GC_HOST_UID}
- extendedWaitUntil:
    visible: Join this round
    timeout: 15000
- tapOn: Join this round
- extendedWaitUntil:
    visible: 2 of 2 playing · Connections only
    timeout: 15000
- assertVisible: Full
- assertNotVisible: Join
- tapOn: Back
- tapOn: Close
- runFlow: steps/sign-out.yaml
