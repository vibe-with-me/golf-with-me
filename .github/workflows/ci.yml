name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check publish artifacts (@withme/nfc)
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2

      - name: Start Supabase (for RLS tests)
        run: supabase start -x studio,mailpit

      - name: Test
        run: bun run test

      - name: Bootstrap env files (smoke)
        run: |
          cp apps/web/.env.example apps/web/.env
          cp apps/api/.dev.vars.example apps/api/.dev.vars

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Web smoke (resolve -> claim -> connect)
        working-directory: apps/web
        # Each attempt starts fresh dev servers (Playwright does not reuse in
        # CI), so a cold-server SSR stall gets a clean process next try.
        run: |
          for attempt in 1 2 3; do
            echo "::group::smoke attempt $attempt"
            if bun run test:e2e; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "smoke attempt $attempt failed; retrying with a fresh dev server"
          done
          exit 1
