# Ports are deliberately non-default (55xxx) so this stack can run alongside
# another local Supabase project (e.g. a production app on the 54xxx defaults).
project_id = "withme-starter"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[realtime]
enabled = false

# Avatars live in Storage. The `avatars` bucket and its policies come from
# supabase/migrations/20261011120000_avatars.sql (so a hosted project gets
# them from `supabase db push`), not from a [storage.buckets] entry here.
# Image transformation stays off: clients resize to 512px themselves, and
# imgproxy would be one more container for nothing.
[storage]
enabled = true

[storage.image_transformation]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Google OAuth: set client_id/secret via env in supabase/.env or the dashboard
# for hosted projects. Disabled by default for zero-cloud-account local dev.
[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
